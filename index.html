<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>受講生管理システム</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    iframe { width: 100%; height: 100%; border: none; }
    .error-box { display: flex; justify-content: center; align-items: center; height: 100%; color: #555; }
  </style>
</head>
<body>
  <div id="container" style="height: 100%;"></div>
  <script>
    // ▼ご自身のGASのURL（末尾が /exec のもの）に書き換えてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzV5yaXGO0Kc62SZxvZqU6khUpM67QVSaspb8VG7g0S9lyOc-2crAw_Jbd2o9oaMNQR/exec";
    const params = new URLSearchParams(window.location.search);

    const targetUrl = GAS_URL + window.location.search;
    
    // allow="clipboard-write" を追加してコピー機能を許可
    document.getElementById("container").innerHTML = 
      `<iframe src="${targetUrl}" allow="clipboard-write"></iframe>`;
  </script>
</body>
</html>
